- id: xmet:0001017
  pref_label: reactive-species capture conjugation
  in_scheme:
  - xmet:reaction_class_scheme
  definition: Conjugation or adduct formation that captures an electrophile or other reactive species. This is a
    warning-sign branch for reactive-metabolite chemistry, regardless of whether an enzyme such as GST contributed.
  parents:
  - xmet:4000011
  synonyms:
  - electrophile trapping
  - reactive metabolite trapping
  - adduct-forming conjugation
  tag_suggestions:
  - predicate: suggestsReactiveProductPotential
    object: xmet:7500103
    certainty: context_dependent
- id: xmet:0001070
  pref_label: protein adduct formation
  in_scheme:
  - xmet:reaction_class_scheme
  definition: Covalent adduct formation between a xenobiotic-derived reactive species and a protein or peptide nucleophile.
    Treat as evidence of reactive chemistry, not as ordinary Phase II detoxication.
