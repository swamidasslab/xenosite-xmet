- id: xmet:4000167
  pref_label: glutathione conjugation
  in_scheme:
  - xmet:reaction_class_scheme
  parents:
  - xmet:0001017
  definition: Conjugation with glutathione, often reflecting electrophile capture. May be GST-mediated or nonenzymatic;
    enzyme mediation belongs in biological context, not the reaction-class parent.
  hasDispositionStage:
  - xmet:4000002
  synonyms:
  - GSH adduct formation
  - GSH conjugation
  - GSH trapping
  - glutathionation
  - glutathione adduct formation
  - glutathione trapping
  tag_suggestions:
  - predicate: suggestsReactiveProductPotential
    object: xmet:7500103
    certainty: context_dependent
  annotation_guidance: Treat GSH conjugation as a reactive-species warning cue unless evidence supports a narrower
    detoxication assertion.
  mass_spectrometry_hints: &id001
    status: evidence_hint_not_required_or_sufficient
    common_nominal_parent_to_product_shift: about +305 Da for many oxidative GSH adducts relative to the reduced
      parent; direct addition to an already formed electrophile may appear closer to +307 Da depending on reaction
      stoichiometry
    diagnostic_neutral_losses:
    - 129 Da is common for GSH conjugates; this is probably the number meant by "127"
    - 75 Da glycine loss and other pathway-dependent losses may also occur
    diagnostic_product_ions:
    - m/z 272
    - m/z 254
    - m/z 179
    - m/z 162
    - m/z 130, depending on ionization mode and instrument method
    curation_note: Use mass-shift and MS/MS clues to prioritize candidate GSH adducts, but confirm with formula,
      isotope pattern, fragments, retention, and structure/path consistency.
