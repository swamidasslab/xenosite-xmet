automation_hints:
  spacy_first_pass:
    entity_patterns:
    - source: preferred_label
    - source: synonyms
    - source: gene_symbol
    recommended_labels:
    - REACTION_CLASS
    - DISPOSITION_STAGE
    - ACTIVATION_MEANING
    - REACTIVE_PRODUCT_POTENTIAL
    - PRODUCT_FAMILY
    - ENZYME_CONTEXT
    - EXPERIMENTAL_SYSTEM
    - BIOLOGICAL_MATRIX
    - SPECIES_CONTEXT
    - TISSUE_CONTEXT
    cleanup_notes:
    - Treat "bioactivation" as ambiguous until classified as reactive-metabolite activation or pharmacologic activation.
    - Enzyme mentions should create context assertions, not reaction class labels.
    - Matrix mentions such as urine/plasma/bile require role disambiguation: detected-in, excreted-in, incubated-in,
        or sampled-from.
  xenosite_forest_path_labeling:
    required_inputs:
    - reactant_structure
    - product_structure
    - atom_map_or_canonical_site_map
    - fired_ruleset
    - fired_rule
    - fired_smarts_pattern
    - path_dependency_graph
    suggested_outputs:
    - reaction_class_terms
    - product_family_terms
    - reactive_product_potential_terms
    - structural_locus_terms
    - disposition_stage_terms
    - pathway_role_terms
    mapping_order:
    - exact Forest rule to reaction class when unambiguous
    - structure delta / product family confirmation
    - path-depth and pathway-role tagging
    - reactive-product-potential tagging
    - disposition-stage tagging
    - ambiguity tag if multiple labels remain plausible
external_extraction_hierarchies:
  principle: Use XMET for reaction/facet labels and use imported or referenced external hierarchies for entities,
    assays, tissues, species, evidence, and provenance. Resolve exact external IDs during curation rather than inventing
    local stand-ins.
  chemicals_and_metabolites:
    sources:
    - PubChem
    - ChEBI
    - MeSH
    - DrugBank where licensed
    - EPA CompTox Dashboard where relevant
    include:
    - xenobiotics
    - drugs and investigational compounds
    - metabolites
    - reactive metabolite terms
    - conjugates
    - trapping agents such as glutathione and cyanide
    grounding_targets:
    - PubChem CID
    - InChIKey
    - ChEBI ID
    - DrugBank ID
    - DTXSID
    notes: Use structure-aware grounding when names are ambiguous; do not let chemical class imply observed toxicity.
  enzymes_genes_and_transporters:
    sources:
    - HGNC gene families
    - NCBI Gene
    - UniProt
    - MeSH enzyme headings
    include_families:
    - CYP
    - UGT
    - SULT
    - GST
    - NAT
    - FMO
    - CES
    - AOX
    - MAO
    - ADH
    - ALDH
    - AKR/CBR
    - EPHX
    - NQO
    - COMT
    - TPMT
    - ABCB
    - ABCC
    - ABCG
    - SLC/SLCO
    grounding_targets:
    - HGNC ID
    - NCBI Gene ID
    - UniProt accession
    notes: Use these as biological context tags, never as reaction-class names.
    implementation_note: Do not mint XMET concepts for these exact enzymes. Export an extraction slim from HGNC/UniProt/NCBI
      Gene and use XMET only for the context facet and extracted assertion type.
  species_and_strains:
    sources:
    - NCBI Taxonomy
    include:
    - human
    - rat
    - mouse
    - dog
    - monkey/nonhuman primate
    - rabbit
    - minipig
    - zebrafish
    - bacterial systems when metabolism is microbial
    grounding_targets:
    - NCBI Taxonomy ID
  tissues_cells_matrices_and_routes:
    sources:
    - UBERON
    - BTO
    - CL
    - OBI
    - NCIT
    include:
    - liver
    - intestine
    - kidney
    - lung
    - skin
    - plasma
    - serum
    - blood
    - urine
    - bile
    - feces
    - microsomes
    - S9 fraction
    - cytosol
    - hepatocytes
    - recombinant enzyme systems
    route_terms:
    - urinary excretion
    - biliary excretion
    - fecal excretion
    - plasma exposure
    grounding_targets:
    - UBERON ID
    - BTO ID
    - CL ID
    - OBI ID
    - NCIT code
  assays_methods_and_evidence:
    sources:
    - OBI
    - ECO
    - BAO
    - NCIT
    - PSI-MS where useful
    include:
    - LC-MS/MS
    - high-resolution mass spectrometry
    - radiolabeled mass balance
    - GSH trapping
    - cyanide trapping
    - microsomal stability
    - hepatocyte incubation
    - recombinant enzyme assay
    - enzyme inhibition assay
    - time-dependent inhibition assay
    - mechanism-based inhibition assay
    - preincubation-dependent inhibition
    - NADPH-dependent inhibition
    - covalent inhibition assay
    - irreversible inhibition assay
    - reversible covalent inhibition
    - suicide inhibitor statement
    notes: Evidence and assay terms should annotate extraction assertions; they should not be local XMET reaction
      terms.
  publications_and_dataset_sources:
    sources:
    - PubMed
    - PubMed Central
    - DOI/Crossref
    - DataCite
    - PROV-O
    - DCAT
    - Dublin Core Terms
    include:
    - article
    - figure
    - table
    - scheme
    - supplementary table
    - dataset version
    - model version
    notes: Citations and source versions live on assertion records and mapping sets.
mapping_sets:
  xenosite_forest_sssom:
    file: xmet-forest.sssom.tsv
    format: SSSOM TSV
    subject_namespace: forest
    object_namespace: xmet
    default_predicate: skos:closeMatch
    scope: Operational mapping from XenoSite-Forest rulesets/rules/SMARTS-derived labels to XMET reaction and product
      terms.
    rule: Use skos:exactMatch only when the Forest rule semantics and XMET term semantics are intentionally identical;
      otherwise prefer closeMatch, broadMatch, narrowMatch, or relatedMatch with comments.
