  mass_spectrometry_hints: &id002
    status: evidence_hint_not_required_or_sufficient
    common_nominal_adduct_shift: about +26 Da for cyano addition to an electrophilic/iminium intermediate; parent-to-product
      shift depends on oxidation state and hydrogen accounting
