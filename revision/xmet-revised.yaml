- id: xmet:0000999
  pref_label: metabolic transfer conjugation
  in_scheme:
  - xmet:reaction_class_scheme
  definition: Enzymatic or enzyme-associated transfer of endogenous functional groups to a xenobiotic or metabolite,
    often discussed as Phase II metabolism. Detoxication or clearance should be asserted separately, not inferred.
  parents:
  - xmet:4000011
  synonyms:
  - Phase II conjugation
  - phase 2 conjugation
  - metabolic conjugation
  hasDispositionStage:
