scheme:
  id: xmet:scheme
  preferred_label: XMET xenobiotic metabolism reaction vocabulary
  iri: https://w3id.org/xenosite/xmet/
  definition: 'SKOS-first vocabulary for naming and tagging xenobiotic metabolism reactions. XMET separates reaction
    chemistry from enzymes, species, evidence, publications, database records, and model runs. Site-localized display
    names are generated from reaction terms plus atom/bond site records outside the ontology.

    '
  design_rules:
  - Reaction classes must not be named by enzyme family.
  - Phase I and Phase II are disposition-stage tags, not hierarchy roots.
  - Bioactivation is not a generic parent reaction class; use scoped activation assertions.
  - Reactive-product labels describe chemical potential, not proven toxicity.
  - Use external ontologies for evidence/provenance/entity grounding whenever practical.
  - Use parents only for preferred hierarchy. Put sometimes-true or model-suggested relationships in tag_suggestions
    or mapping_hints.
  - A tag_suggestion is never a hard inference; downstream software must preserve its confidence/source.
  - XenoSite-Forest rule-to-term correspondences belong in sidecar SSSOM mapping files, not as preferred ontology
    hierarchy.
  - Forest rule IDs and SMARTS can suggest labels, but they are evidence/mapping sources rather than public reaction-class
    concepts.
  - Distinguish Phase II metabolic transfer conjugation from reactive-species capture or macromolecular adduct formation;
    do not infer detoxication from conjugation alone.
  - Treat time-dependent inhibition as a warning/effect assertion and extraction cue; do not infer a specific covalent
    adduct or reactive metabolite without supporting evidence.
  - Represent covalent inhibitors and suicide inhibitors as effect/assertion categories and extraction cues; use
    reaction/product evidence to connect them to specific adduct chemistry.
  - Do not repurpose existing XMET IDs when a concept meaning narrows or shifts; mint a new ID and optionally deprecate
    the old broader concept for new annotation.
external_reuse_policy:
  provenance:
    use:
    - PROV-O
    - DCAT
    - Dublin Core Terms
    note: Source datasets, file versions, row fingerprints, model runs, and import pipelines belong in XenoBase
      assertion records.
  evidence:
    use:
    - ECO
    - OBI
    note: Evidence type, confidence, assay details, and curation state are assertion properties, not reaction ontology
      parents.
  entities:
    chemicals:
      use:
      - PubChem CID
      - ChEBI
      - InChIKey
      - DrugBank when licensed/available
      - EPA CompTox DTXSID when relevant
    genes_proteins:
      use:
      - HGNC
      - UniProt
      - NCBI Gene
    species:
      use:
      - NCBI Taxonomy
    anatomy_and_matrices:
      use:
      - UBERON
      - BTO
      - OBI
      - NCIT
  deferred_local_spines:
  - rule provenance
  - publication evidence
  - product observation status
  - detailed source/database versioning
  - exact enzyme identity namespace
predicates:
  broaderByReactionClass:
    subproperty_of: skos:broader
    inverse: narrowerByReactionClass
    definition: Parent relation inside the chemist-facing reaction class hierarchy.
  broaderByProductFamily:
    subproperty_of: skos:broader
    inverse: narrowerByProductFamily
    definition: Parent relation for product-family concepts.
  broaderByStructuralLocus:
    subproperty_of: skos:broader
    inverse: narrowerByStructuralLocus
    definition: Parent relation for structural site/locus classes.
  hasDispositionStage:
    definition: Conventional ADME/metabolism stage tag. Use as classification metadata, not as a chemical superclass.
  hasBiologicalEffect:
    definition: Assertion-level effect/outcome facet, such as pharmacologic activation, reactive-metabolite activation,
      or detoxication. Do not use as a hard reaction-class parent.
  nlpCueFor:
    definition: Text-mining task for which the term is a cue label.
  suggestsReactiveProductPotential:
    definition: 'Soft tag suggestion: product class or path often has this reactive-product potential, but this
      is not a hard inference.'
  mappingHint:
    definition: Non-inferential relationship used to suggest labels or external mappings; not a hard semantic assertion.
concept_schemes:
  reaction_class:
    id: xmet:reaction_class_scheme
    preferred_label: reaction class scheme
    definition: Chemist-facing hierarchy of reaction transformations.
  disposition_stage:
    id: xmet:disposition_stage_scheme
    preferred_label: disposition stage scheme
    definition: Small controlled set for Phase I, Phase II, transport, and elimination framing.
  biological_effect:
    id: xmet:biological_effect_scheme
    preferred_label: biological effect scheme
    definition: Scoped assertion terms for biological or pharmacologic consequences of metabolism. These are not
      reaction-class parents.
  reactive_product_potential:
    id: xmet:reactive_product_potential_scheme
    preferred_label: reactive product potential scheme
    definition: Tags for possible electrophilic, radical, covalent-binding, or trapping-prone product chemistry.
  product_family:
    id: xmet:product_family_scheme
    preferred_label: product family scheme
    definition: Product classes useful for med-chem reaction naming and text mining.
  structural_locus:
    id: xmet:structural_locus_scheme
    preferred_label: structural locus scheme
    definition: Structural location or motif where a transformation occurs.
  pathway_role:
    id: xmet:pathway_role_scheme
    preferred_label: pathway role scheme
    definition: Role of a step in a multi-step path from parent to product.
  text_mining:
    id: xmet:text_mining_scheme
    preferred_label: text-mining cue scheme
    definition: Cue labels for spaCy/LLM extraction of metabolism statements.
  biological_context:
    id: xmet:biological_context_scheme
    preferred_label: biological context cue scheme
    definition: Enzyme, species, matrix, tissue, and assay terms for extraction and grounding. Not reaction names.
concepts:
- id: xmet:4000000
  pref_label: xenobiotic biotransformation
  in_scheme:
  - xmet:reaction_class_scheme
  definition: Chemical alteration of an exogenous compound in a biological system.
  synonyms:
  - xenobiotic metabolism
  - drug metabolism
  - biotransformation
- id: xmet:4000001
  pref_label: Phase I metabolism
  in_scheme:
  - xmet:disposition_stage_scheme
  definition: Conventional disposition-stage tag for functionalization reactions such as oxidation, reduction, and
    hydrolysis.
  synonyms:
  - phase I
  - phase 1
  - functionalization phase
- id: xmet:4000002
  pref_label: Phase II metabolism
  in_scheme:
  - xmet:disposition_stage_scheme
  definition: Conventional disposition-stage tag for conjugation reactions with endogenous groups.
  synonyms:
  - phase II
  - phase 2
  - conjugation phase
- id: xmet:4000003
  pref_label: Phase III transport
  in_scheme:
  - xmet:disposition_stage_scheme
  definition: Transporter-mediated disposition. Included for text mining and context, not as a reaction class.
  synonyms:
  - phase III
  - phase 3
  - transport phase
- id: xmet:0000004
  pref_label: elimination or excretion
  in_scheme:
  - xmet:disposition_stage_scheme
  definition: Removal of xenobiotic or metabolite through urine, bile, feces, breath, or related routes.
  synonyms:
  - excretion
  - elimination
- id: xmet:0003000
  pref_label: metabolic activation language
  in_scheme:
  - xmet:biological_effect_scheme
  - xmet:text_mining_scheme
  definition: Ambiguous text cue indicating that metabolism increases some form of activity or reactivity. Do not
    use as a final reaction label without a scoped subtype.
  synonyms:
  - bioactivation
  - metabolic activation
  - activated by metabolism
  annotation_guidance: Prefer a narrower biological effect when text or structure permits.
  preferred_spine: biological_effect
  parents:
  - xmet:0002999
- id: xmet:0003002
  pref_label: reactive-metabolite activation
  in_scheme:
  - xmet:biological_effect_scheme
  - xmet:text_mining_scheme
  definition: Metabolic formation of a product with plausible or observed chemical reactivity, trapping, covalent-binding,
    or toxicity relevance.
  parents:
  - xmet:0003000
  synonyms:
  - bioactivated to a reactive metabolite
  - reactive metabolite formation
  - toxic bioactivation
  preferred_spine: biological_effect
- id: xmet:0003003
  pref_label: pharmacologic metabolic activation
  in_scheme:
  - xmet:biological_effect_scheme
  - xmet:text_mining_scheme
  definition: Metabolic formation of a pharmacologically active or more active metabolite, including prodrug activation.
  parents:
  - xmet:0003000
  synonyms:
  - active metabolite formation
  - prodrug activation
  - converted to active metabolite
  preferred_spine: biological_effect
- id: xmet:0003004
  pref_label: detoxication assertion
  in_scheme:
  - xmet:biological_effect_scheme
  - xmet:text_mining_scheme
  definition: Assertion that metabolism reduces chemical reactivity, toxicity, or exposure. This is context dependent
    and belongs on assertions.
  synonyms:
  - detoxication
  - detoxification
  - bioinactivation
  preferred_spine: biological_effect
  parents:
  - xmet:0002999
- id: xmet:0003005
  pref_label: metabolic activation effect unspecified
  in_scheme:
  - xmet:biological_effect_scheme
  definition: Metabolic activation is mentioned, but the text does not distinguish pharmacologic activation from
    reactive-metabolite activation.
  preferred_spine: biological_effect
  parents:
  - xmet:0002999
- id: xmet:4000213
  pref_label: reaction class
  in_scheme:
  - xmet:reaction_class_scheme
  definition: Enzyme-independent chemical transformation class.
  parents:
  - xmet:4000000
- id: xmet:4000009
  pref_label: oxidation
  in_scheme:
  - xmet:reaction_class_scheme
  definition: Reaction class involving net oxidation or oxygen insertion.
  parents:
  - xmet:0000005
  hasDispositionStage:
  - xmet:4000001
- id: xmet:4000008
  pref_label: reduction
  in_scheme:
  - xmet:reaction_class_scheme
  definition: Reaction class involving net reduction, hydrogenation, or reductive cleavage.
  parents:
  - xmet:0000005
  hasDispositionStage:
  - xmet:4000001
- id: xmet:4000007
  pref_label: hydrolysis
  in_scheme:
  - xmet:reaction_class_scheme
  definition: Bond cleavage by water addition or hydrolytic opening.
  parents:
  - xmet:0000006
  hasDispositionStage:
  - xmet:4000001
- id: xmet:4000011
  pref_label: conjugation
  in_scheme:
  - xmet:reaction_class_scheme
  definition: Formation of a covalent conjugate or adduct. Use narrower branches to distinguish metabolic transfer
    conjugation from reactive-species capture or macromolecular adduct formation.
  parents:
  - xmet:0000007
  hasDispositionStage:
  - xmet:4000002
  annotation_guidance: Do not infer detoxication from conjugation alone. Phase II transfer conjugation and adduct-forming
    conjugation are separate branches.
- id: xmet:4000006
  pref_label: dehydrogenation
  in_scheme:
  - xmet:reaction_class_scheme
  definition: Removal of hydrogen atoms to form a carbonyl, iminium, unsaturated bond, aromatic system, or quinoid
    system.
  parents:
  - xmet:4000042
  hasDispositionStage:
  - xmet:4000001
- id: xmet:4000012
  pref_label: hydroxylation
  in_scheme:
  - xmet:reaction_class_scheme
  definition: Addition or replacement leading to a hydroxylated product.
  parents:
  - xmet:4000009
  hasDispositionStage:
  - xmet:4000001
- id: xmet:4000013
  pref_label: aromatic hydroxylation
  in_scheme:
