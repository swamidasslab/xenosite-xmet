  definition: Aldehyde-equivalent fragment released as a leaving group / coproduct, typically from 
    oxidative dealkylation (formaldehyde from demethylation, acetaldehyde from deethylation, and 
    higher alkanals analogously). Under carbonyl leaving fragment.
