# XMET thesaurus (authoring source). Export to xmet.skos.jsonld for Rust.
scheme:
  id: xmet:scheme
  preferred_label: Xenobiotic Reaction Metabolism
  iri: https://xenosite.org/ontology/xmet#
  definition: Metabolism-specific med-chem SKOS thesaurus for xenobiotic reaction naming — not a full
    chemical ontology. Site-localized display names use templates outside the concept scheme. SSSOM maps
    to RXNO/MOP/GO/ChEBI/Rhea/KEGG/MeSH/ECO/CHMO.
spines:
- id: xmet:1000000
  preferred_label: metabolism phase
  definition: Phase framing for xenobiotic biotransformation (I / II / III).
  synonyms: &id001
  - metabolism_phase
  - phase
- id: xmet:1100000
  preferred_label: chemical transformation
  definition: Enzyme-independent chemical edit class (oxidation, reduction, …).
  synonyms: &id002
  - chemical_transformation
  - transformation
- id: xmet:1200000
  preferred_label: phase I reaction family
  definition: Rainbow-anchored Phase I reaction classes and detailed types.
  synonyms: &id003
  - phase_1_reaction_family
  - phase I family
- id: xmet:1300000
  preferred_label: phase II conjugation family
  definition: Conjugation families typical of Phase II xenobiotic metabolism.
  synonyms: &id004
  - phase_2_conjugation_family
  - conjugation family
- id: xmet:1400000
  preferred_label: medchem liability
  definition: Medicinal-chemistry liability and design handles for a reaction.
  synonyms: &id005
  - medchem_liability
  - liability
- id: xmet:1500000
  preferred_label: reactive metabolite family
  definition: Reactive or trapping-prone metabolite product families.
  synonyms: &id006
  - reactive_metabolite_family
  - reactive metabolite
- id: xmet:2500000
  preferred_label: metabolite product family
  definition: Stable or ordinary metabolite product classes (conjugates, oxygenated products, dealkylation
    products, …). Distinct from reactive / trapping-prone species.
  synonyms:
  - metabolite_product_family
  - metabolite product
  - product class
- id: xmet:1600000
  preferred_label: site type
  definition: Where on the molecule the transformation is localized.
  synonyms: &id007
  - site_type
  - site class
- id: xmet:1700000
  preferred_label: structural delta
  definition: Structural / formula / aromaticity / bond-order change facets.
  synonyms: &id008
  - structural_delta
  - delta
- id: xmet:1800000
  preferred_label: product status
  definition: Observation / prediction / pathway status of a metabolite.
  synonyms: &id009
  - product_status
- id: xmet:1900000
  preferred_label: rule provenance
  definition: How a tag was produced (SMARTS, rule name, priority, exclusions).
  synonyms: &id010
  - rule_provenance
  - provenance
- id: xmet:2000000
  preferred_label: evidence
  definition: Evidence type supporting a named transformation or product.
  synonyms: &id011
  - evidence
- id: xmet:2100000
  preferred_label: biological context
  definition: Orthogonal biological framing (enzyme, tissue, species, matrix).
  synonyms: &id012
  - biological_context
- id: xmet:6000000
  preferred_label: ambiguity and underspecification
  definition: Cross-cutting spine for incomplete, conflicting, or underdetermined naming evidence. Prefer
    specific ambiguity subtypes; tag alongside positive terms rather than replacing them.
  synonyms: []
- id: xmet:9000000
  preferred_label: Metabolic Forest map
  definition: Alias / mapping spine for Metabolic Forest rulesets → rules → patterns. Opaque forest.*
    CURIEs only; not the chemist backbone.
  synonyms: &id014
  - forest alignment
  - ruleset–rule–pattern map
- id: xmet:2200000
  preferred_label: leaving group
  definition: Fragment or moiety that departs in a cleavage / substitution / dealkylation / hydrolysis
    step. Med-chem handle for soft-spot design.
  synonyms: &id013
  - leaving_group
  - departing group
- id: xmet:2300000
  preferred_label: pharmacological role
  definition: Metabolism-specific pharmacological framing.
  synonyms: []
- id: xmet:2400000
  preferred_label: annotation about
  definition: Whether a tag is about parent, product, or reaction.
  synonyms: []
concepts:
- id: xmet:0000000
  preferred_label: xenobiotic biotransformation
  synonyms:
  - xenobiotic metabolism
  - biotransformation
  - drug metabolism
  definition: Chemical alteration of an exogenous substance in a biological system.
- id: xmet:0000001
  preferred_label: phase I
  synonyms:
  - phase 1
  - functionalization
  - Metabolic Detoxication, Phase I
  - phase 1 metabolism
  - functionalization phase
  definition: 'Functionalization: oxidation, reduction, hydrolysis, and related edits that introduce or
    expose polar groups.'
  parents:
  - xmet:1000000
  related_match:
  - xmet:9000018
- id: xmet:0000002
  preferred_label: phase II
  synonyms:
  - phase 2
  - conjugation
  - Metabolic Detoxication, Phase II
  - phase 2 metabolism
  - conjugation phase
  definition: Conjugation with hydrophilic moieties (glucuronide, sulfate, glutathione, acetyl, methyl,
    amino acids, …).
  parents:
  - xmet:1000000
- id: xmet:0000003
  preferred_label: phase III transport
  synonyms:
  - phase 3
  - phase III
  - transport phase
  definition: Transporter-mediated disposition related to xenobiotic handling; related to metabolism naming
    but not a primary reaction label.
  parents:
  - xmet:1000000
- id: xmet:0000010
  preferred_label: stable oxygenation
  synonyms:
  - SO class
  - stable oxygen addition class
  - Rainbow stable oxygenation
  - SO class (full name)
  - stable_oxygenation
  definition: 'Rainbow Phase I class: oxygenation that yields a stable oxygenated metabolite (aromatic/aliphatic
    hydroxylation, epoxidation, N-oxidation, S-oxidation).'
  parents:
  - xmet:1200000
  related_match:
  - xmet:9000010
- id: xmet:0000011
  preferred_label: unstable oxygenation
  synonyms:
  - UO class
  - unstable oxygen addition class
  - Rainbow unstable oxygenation
  - UO class (full name)
  - unstable_oxygenation
  definition: 'Rainbow Phase I class: oxygenation that triggers cleavage or rearrangement (N-/O-/S-/C-dealkylation,
    oxidative deamination, oxidative dehalogenation).'
  parents:
  - xmet:1200000
  related_match:
  - xmet:9000011
- id: xmet:0000012
  preferred_label: dehydrogenation
  synonyms:
  - desaturation
  definition: Phase I class that extracts hydrogen(s) to form a multiple bond, iminium, or quinoid (alcohol→carbonyl,
    bond unsaturation, quinone/imine/methide formation, iminium formation). Maps to the Metabolic Forest
    / Rainbow dehydrogenation ruleset; prefer this full name over localized abbreviations.
  parents:
  - xmet:1100000
  - xmet:0000001
  - xmet:1200000
  related_match:
  - xmet:9000012
  - xmet:9100300
  - xmet:7000001
  - xmet:7200003
  - xmet:7700004
  - xmet:7400003
- id: xmet:0000013
  preferred_label: hydrolysis
  definition: Phase I class in which water addition cleaves amide, ester, ether, or related bonds (including
    cyanide/nitrile hydrolysis). Maps to the Metabolic Forest / Rainbow hydrolysis ruleset; prefer this
    full name over localized abbreviations.
  parents:
  - xmet:1100000
  - xmet:0000001
  - xmet:1200000
  related_match:
  - xmet:9000013
  - xmet:9100400
  - xmet:7000003
  - xmet:7200002
  - xmet:7300002
  - xmet:7700005
- id: xmet:0000014
  preferred_label: reduction
  definition: Phase I class that removes oxygen or adds hydrogen(s) (nitro, carbonyl, and sulfo reduction;
    reductive dehalogenation; hydrogenation). Maps to the Metabolic Forest / Rainbow reduction ruleset;
    prefer this full name over localized abbreviations.
  parents:
  - xmet:1100000
  - xmet:0000001
  - xmet:1200000
  related_match:
  - xmet:9000014
  - xmet:7000002
  - xmet:7400003
