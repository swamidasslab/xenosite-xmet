  - 1-step quinone formation
  - direct quinone formation
  definition: Quinone species (quinone, quinone-imine, quinone-methide, or imine-methide) whose elementary-plan
    dependency cone into terminating dehydrogenation has size 1 (DH alone — both quinoid ends already
    present). Free co-occurring plan steps that do not precede DH (e.g. dealkylation with empty precedes)
    do not deepen this count (quinone-formation / Rainbow papers).
  parents:
  - xmet:0000300
  related_match:
  - xmet:7900001
- id: xmet:0000308
  preferred_label: two-step quinone formation
  synonyms:
  - 2-step quinone formation
  definition: Quinone species whose dependency cone into terminating dehydrogenation has size 2 — one
    preparatory elementary step that precedes DH via the plan's precedes edges (installs a WillAdd oxygen),
    then DH. Prep in the cone is typically hydroxylation or oxidative dehalogenation; free dealkylation
    that does not precede DH is tagged separately and does not count toward depth. E.g. phenol → p-benzoquinone
    (OH ≺ DH).
  parents:
  - xmet:0000300
  related_match:
  - xmet:7900002
  - xmet:7900003
  - xmet:6000040
- id: xmet:0000309
  preferred_label: three-step quinone formation
  synonyms:
  - 3-step quinone formation
  definition: Quinone species whose dependency cone into terminating dehydrogenation has size ≥3 — two
    (or more) preparatory elementary steps that precede DH, then DH. E.g. benzene → p-benzoquinone (OH
    ≺ DH and OH ≺ DH). Raw plan length is not used; free unrelated steps elsewhere on the molecule do
    not deepen the cone.
  parents:
  - xmet:0000300
  related_match:
  - xmet:7900002
  - xmet:7900003
  - xmet:6000040
