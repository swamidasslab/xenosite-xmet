  definition: Cross-cutting spine for incomplete, conflicting, or underdetermined naming evidence. Prefer
    specific ambiguity subtypes; tag alongside positive terms rather than replacing them.
  parents:
  - xmet:0000000
- id: xmet:6000001
  preferred_label: ambiguous reaction
  synonyms:
  - underspecified reaction
  definition: 'Broad flag: more than one incompatible reading remains open.'
  parents:
  - xmet:6000000
- id: xmet:6000010
  preferred_label: site-of-metabolism ambiguity
  definition: Which atom or bond is the SOM is not uniquely determined.
  parents:
  - xmet:6000000
- id: xmet:6000011
  preferred_label: regiochemical ambiguity
  definition: Multiple regioisomeric sites remain plausible.
  parents:
  - xmet:6000000
  - xmet:6000010
  related_match:
  - xmet:6000001
- id: xmet:6000012
  preferred_label: stereochemical ambiguity
  definition: Stereo outcome (or stereo of the site) is not specified.
  parents:
  - xmet:6000000
  - xmet:6000010
  related_match:
  - xmet:6000001
- id: xmet:6000020
  preferred_label: reaction-type ambiguity
  definition: Multiple reaction-type labels remain compatible with the evidence.
  parents:
  - xmet:6000000
- id: xmet:6000021
  preferred_label: competing-type ambiguity
  definition: Two or more named types actively compete (e.g. epoxidation vs aromatic hydroxylation via
    arene oxide).
  parents:
  - xmet:6000000
  - xmet:6000020
  related_match:
  - xmet:6000001
- id: xmet:6000022
  preferred_label: mechanism ambiguity
  definition: Overall type may be clear but the mechanistic path is not (e.g. NIH-shift vs direct insertion).
  parents:
  - xmet:6000000
  - xmet:6000020
  related_match:
  - xmet:6000001
- id: xmet:6000030
  preferred_label: metabolite-structure underspecification
  definition: Product structure is incomplete (missing stereo, tautomer, or connectivity detail).
  parents:
  - xmet:6000000
- id: xmet:6000031
  preferred_label: atom-mapping underspecification
  definition: Atom map is missing, partial, or inconsistent, blocking site-level tags.
  parents:
  - xmet:6000000
  - xmet:6000030
  related_match:
  - xmet:6000001
- id: xmet:6000032
  preferred_label: formula-only evidence
  definition: Only formula/delta evidence is available; connectivity change is not grounded.
  parents:
  - xmet:6000000
  - xmet:6000030
  related_match:
  - xmet:6000001
- id: xmet:6000040
  preferred_label: pathway-depth ambiguity
  definition: Unclear whether the observed change is one-step or requires intermediates.
  parents:
  - xmet:6000000
  related_match:
  - xmet:0000308
  - xmet:0000309
- id: xmet:6000041
  preferred_label: intermediate underspecification
  definition: A multi-step path is implied but intermediate structures are not specified.
  parents:
  - xmet:6000000
  - xmet:6000040
  related_match:
  - xmet:6000001
- id: xmet:6000050
  preferred_label: phase ambiguity
  definition: Unclear whether the step is best typed as phase I, phase II, or neither.
  parents:
  - xmet:6000000
- id: xmet:6000051
  preferred_label: forest-map correspondence ambiguity
  definition: Chemist typing and Metabolic Forest rule/pattern correspondence are unresolved or conflicting.
  parents:
  - xmet:6000000
  - xmet:6000001
  related_match:
  - xmet:6000001
- id: xmet:6000052
  preferred_label: external-ontology alignment ambiguity
  definition: Mapping to MeSH/MOP/KEGG (or similar) is uncertain; keep XMET terms and mark alignment soft.
  parents:
  - xmet:6000000
  - xmet:6000001
  related_match:
  - xmet:6000001
- id: xmet:6000060
  preferred_label: aromatic-impact ambiguity
  definition: Impact on aromatic/conjugated systems is unclear (preserve vs dearomatize vs quinoid).
  parents:
  - xmet:6000000
  - xmet:6000001
  related_match:
  - xmet:6000001
- id: xmet:6000061
  preferred_label: electrophile-role ambiguity
  definition: Whether the step generates or consumes an electrophile is unclear.
  parents:
  - xmet:6000000
  - xmet:6000001
  related_match:
  - xmet:6000001
- id: xmet:6000070
  preferred_label: provenance underspecification
  definition: Evidence source/tag provenance is missing (no structural match and no caller tags).
  parents:
  - xmet:6000000
- id: xmet:6000099
  preferred_label: fully specified
  synonyms:
  - unambiguous naming
  definition: No outstanding ambiguity flags for the dimensions under consideration.
  parents:
  - xmet:6000000
- id: xmet:7000000
  preferred_label: redox polarity
  definition: 'Cross-cutting spine: net redox character of the transformation, independent of named reaction
    type.'
  parents:
  - xmet:1700000
- id: xmet:7000001
  preferred_label: net oxidation
  definition: Net loss of electrons / gain of oxygen or unsaturation.
  parents:
  - xmet:7000000
  related_match:
  - xmet:0000100
  - xmet:0000110
  - xmet:0000200
  - xmet:0000012
  - xmet:0000300
- id: xmet:7000002
  preferred_label: net reduction
  definition: Net gain of electrons / loss of oxygen or gain of saturation.
  parents:
  - xmet:7000000
  related_match:
  - xmet:0000014
  - xmet:0000500
- id: xmet:7000003
  preferred_label: redox-neutral
  definition: No net redox change (e.g. many conjugations, tautomerizations, hydrolyses).
  parents:
  - xmet:7000000
  related_match:
  - xmet:0000013
  - xmet:0001000
  - xmet:0001030
  - xmet:0002000
- id: xmet:7000004
  preferred_label: redox polarity unspecified
  definition: Redox polarity not determined from available evidence.
  parents:
  - xmet:7000000
- id: xmet:7100000
  preferred_label: site atom class
  definition: 'Cross-cutting spine: principal element class at the site of metabolism.'
  parents:
  - xmet:1600000
  synonyms:
  - site_atom_class
- id: xmet:7100001
  preferred_label: carbon site
  definition: Primary SOM involves carbon.
  parents:
  - xmet:7100000
  related_match:
  - xmet:0000100
- id: xmet:7100002
  preferred_label: nitrogen site
  definition: Primary SOM involves nitrogen (lone pair or C–N).
  parents:
  - xmet:7100000
  related_match:
  - xmet:0000201
- id: xmet:7100003
  preferred_label: oxygen site
  definition: Primary SOM involves oxygen (lone pair or C–O).
  parents:
  - xmet:7100000
  related_match:
  - xmet:0000202
- id: xmet:7100004
  preferred_label: sulfur site
  definition: Primary SOM involves sulfur.
  parents:
  - xmet:7100000
  related_match:
  - xmet:0000203
- id: xmet:7100005
  preferred_label: halogen site
  definition: Primary SOM involves halogen.
  parents:
  - xmet:7100000
  related_match:
  - xmet:0000210
- id: xmet:7100006
  preferred_label: phosphorus site
  definition: Primary SOM involves phosphorus.
  parents:
  - xmet:7100000
- id: xmet:7100007
  preferred_label: multi-element site
  definition: SOM spans more than one heavy-element class (e.g. C–X cleavage).
  parents:
  - xmet:7100000
  related_match:
  - xmet:0000200
  - xmet:0000201
  - xmet:0000202
  - xmet:0000203
- id: xmet:7100008
  preferred_label: site atom class unspecified
  definition: Site element class not asserted.
  parents:
  - xmet:7100000
- id: xmet:7200000
  preferred_label: bond-edit topology
  definition: 'Cross-cutting spine: graph-edit shape of the transformation.'
  parents:
  - xmet:1700000
- id: xmet:7200001
  preferred_label: atom addition
  definition: Heavy atom(s) added without bond cleavage of the scaffold (e.g. hydroxylation).
  parents:
  - xmet:7200000
  related_match:
  - xmet:0000100
- id: xmet:7200002
  preferred_label: bond cleavage
  definition: A heavy-atom bond is broken (dealkylation, hydrolysis, dehalogenation).
  parents:
  - xmet:7200000
  related_match:
  - xmet:0000200
  - xmet:0000210
  - xmet:0000013
- id: xmet:7200003
  preferred_label: bond order change
  definition: Bond order increases or decreases without heavy-atom count change (dehydrogenation, hydrogenation).
  parents:
  - xmet:7200000
  related_match:
  - xmet:0000012
  - xmet:0000500
- id: xmet:7200004
  preferred_label: substitution
  definition: One substituent replaces another at a site.
  parents:
  - xmet:7200000
- id: xmet:7200005
  preferred_label: rearrangement topology
  definition: Atom connectivity is reshuffled (NIH shift, acyl migration, skeletal rearrangement).
  parents:
  - xmet:7200000
  related_match:
  - xmet:0002000
- id: xmet:7200006
  preferred_label: ring closure
  definition: A new ring is formed.
  parents:
  - xmet:7200000
  related_match:
  - xmet:0000110
- id: xmet:7200007
  preferred_label: ring opening topology
  definition: A ring bond is opened.
  parents:
  - xmet:7200000
- id: xmet:7200008
  preferred_label: bond-edit topology unspecified
  definition: Graph-edit class not asserted.
  parents:
  - xmet:7200000
- id: xmet:7300000
  preferred_label: metabolite cardinality
  definition: 'Cross-cutting spine: whether the reaction yields one observed metabolite or fragments into
    more.'
  parents:
  - xmet:1700000
- id: xmet:7300001
  preferred_label: single-metabolite transformation
  definition: One principal product retains the scaffold (Rainbow stable-oxygenation style outcome).
  parents:
  - xmet:7300000
  related_match:
  - xmet:0000100
- id: xmet:7300002
  preferred_label: fragmenting transformation
  definition: Scaffold cleavage yields two (or more) products (dealkylation, hydrolysis).
  parents:
  - xmet:7300000
  related_match:
  - xmet:0000200
  - xmet:0000013
- id: xmet:7300003
  preferred_label: metabolite cardinality unspecified
  definition: Whether the reaction fragments is not asserted.
  parents:
  - xmet:7300000
- id: xmet:7400000
  preferred_label: oxygenation outcome
  definition: 'Cross-cutting chemist spine for oxygenation fate: stable oxygen addition versus oxygen-triggered
    cleavage. Distinct from the Metabolic Forest map nodes.'
  parents:
  - xmet:1700000
- id: xmet:7400001
  preferred_label: stable oxygen addition
  definition: Oxygen is retained in a single observable oxygenated metabolite.
  parents:
  - xmet:7400000
  related_match:
  - xmet:0000100
  - xmet:0000110
- id: xmet:7400002
  preferred_label: oxygen-triggered cleavage
  definition: Oxygenation precipitates heavy-bond cleavage (unstable oxygenation outcome).
  parents:
  - xmet:7400000
  related_match:
  - xmet:0000200
  - xmet:0000210
- id: xmet:7400003
  preferred_label: non-oxygenative transformation
  definition: No oxygenation step defines the outcome.
  parents:
  - xmet:7400000
  related_match:
  - xmet:0000012
  - xmet:0000014
- id: xmet:7400004
  preferred_label: oxygenation outcome unspecified
  definition: Oxygenation fate not asserted.
  parents:
  - xmet:7400000
- id: xmet:7500000
  preferred_label: electrophile role
  definition: 'Cross-cutting spine: relationship of the step to electrophilic reactivity / soft-hard capture.'
  parents:
  - xmet:1500000
  synonyms:
  - electrophile_role
- id: xmet:7500001
  preferred_label: electrophile generation
  definition: Forms or unmasks an electrophilic metabolite.
  parents:
  - xmet:7500000
  related_match:
  - xmet:0000300
  - xmet:0003000
- id: xmet:7500002
  preferred_label: electrophile consumption
  definition: Captures or quenches an electrophile (e.g. GSH conjugation).
  parents:
  - xmet:7500000
  related_match:
  - xmet:0001030
  - xmet:0001031
  - xmet:0003001
- id: xmet:7500003
  preferred_label: nucleophile exposure
  definition: Exposes a nucleophilic handle for later conjugation.
  parents:
  - xmet:7500000
  related_match:
  - xmet:0001000
- id: xmet:7500004
  preferred_label: reactivity-neutral step
  definition: Neither generates nor consumes a notable electrophile in the usual sense.
  parents:
  - xmet:7500000
  related_match:
  - xmet:0003001
- id: xmet:7500005
  preferred_label: electrophile role unspecified
  definition: Electrophile role not asserted.
  parents:
  - xmet:7500000
- id: xmet:7600000
  preferred_label: ring fate
  definition: 'Cross-cutting spine: effect on ring systems.'
  parents:
  - xmet:1700000
- id: xmet:7600001
  preferred_label: ring preserved
  definition: Existing rings unchanged in membership.
  parents:
  - xmet:7600000
  related_match:
  - xmet:0004001
- id: xmet:7600002
  preferred_label: ring opened
  definition: A ring is opened.
  parents:
  - xmet:7600000
- id: xmet:7600003
  preferred_label: ring formed
  definition: A new ring is formed (e.g. epoxide).
  parents:
  - xmet:7600000
  related_match:
  - xmet:0000110
- id: xmet:7600004
  preferred_label: ring expanded
  definition: Ring size increases.
  parents:
  - xmet:7600000
- id: xmet:7600005
  preferred_label: ring contracted
  definition: Ring size decreases.
  parents:
  - xmet:7600000
- id: xmet:7600006
  preferred_label: ring fate unspecified
  definition: Ring fate not asserted.
  parents:
  - xmet:7600000
- id: xmet:7700000
  preferred_label: formula-delta class
  definition: Cross-cutting spine keyed to heavy-atom formula change; highly automatable from reactant/product
    formulas.
  parents:
  - xmet:1700000
- id: xmet:7700001
  preferred_label: oxygen gain
  synonyms:
  - +O
  definition: Net +O (and no other heavy-atom change, unless further specialized).
  parents:
  - xmet:7700000
  related_match:
  - xmet:0000100
  - xmet:0000110
- id: xmet:7700002
  preferred_label: oxygen loss
  synonyms:
  - -O
  definition: Net −O.
  parents:
  - xmet:7700000
- id: xmet:7700003
  preferred_label: hydrogenation delta
  definition: Net +H₂ equivalent without other heavy-atom change (often inferred with bond-order change).
  parents:
  - xmet:7700000
  related_match:
  - xmet:0000500
- id: xmet:7700004
  preferred_label: dehydrogenation delta
  definition: Net −H₂ equivalent without other heavy-atom change.
  parents:
  - xmet:7700000
  related_match:
  - xmet:0000012
- id: xmet:7700005
  preferred_label: water addition delta
  synonyms:
  - +H2O
  - hydration delta
  definition: Net +H₂O.
  parents:
  - xmet:7700000
  related_match:
  - xmet:0000013
- id: xmet:7700006
  preferred_label: water loss delta
  synonyms:
  - -H2O
  definition: Net −H₂O.
  parents:
  - xmet:7700000
- id: xmet:7700007
  preferred_label: alkyl loss delta
  definition: Net loss of carbon(s) consistent with dealkylation/fragmentation.
  parents:
  - xmet:7700000
- id: xmet:7700008
  preferred_label: conjugate gain delta
  definition: Net gain matching a conjugation adduct formula class (when known).
  parents:
  - xmet:7700000
  related_match:
  - xmet:0001000
- id: xmet:7700009
  preferred_label: halogen loss delta
  definition: Net loss of halogen.
  parents:
  - xmet:7700000
  related_match:
  - xmet:0000210
- id: xmet:7700010
  preferred_label: no heavy-atom delta
  definition: Heavy-atom formula unchanged (tautomer, many dehydrogenations if H ignored, rearrangements).
  parents:
  - xmet:7700000
  related_match:
  - xmet:0002000
- id: xmet:7700011
  preferred_label: formula-delta unspecified
  definition: Formula delta class not asserted.
  parents:
  - xmet:7700000
- id: xmet:7800000
  preferred_label: site aromaticity
  definition: 'Cross-cutting spine: aromatic character of the mapped site on the reactant.'
  parents:
  - xmet:1600000
  synonyms:
  - site_aromaticity
- id: xmet:7800001
  preferred_label: aromatic site
  definition: Mapped site atom(s) are aromatic on the reactant.
  parents:
  - xmet:7800000
  related_match:
  - xmet:0000101
- id: xmet:7800002
  preferred_label: aliphatic site
  definition: Mapped site atom(s) are non-aromatic on the reactant.
  parents:
  - xmet:7800000
  related_match:
  - xmet:0000102
- id: xmet:7800003
  preferred_label: site aromaticity unspecified
  definition: Aromaticity of the site was not determined (no map / no probe).
  parents:
  - xmet:7800000
- id: xmet:7900000
  preferred_label: pathway-step role
  definition: 'Cross-cutting spine: role of this step in a multi-step metabolic path.'
  parents:
  - xmet:1700000
- id: xmet:7900001
  preferred_label: direct one-step transformation
  definition: Observed product arises in a single metabolic step from the named parent.
  parents:
  - xmet:7900000
  related_match:
  - xmet:0000307
- id: xmet:7900002
  preferred_label: multi-step pathway member
  definition: Step participates in a path of depth ≥ 2 (e.g. two- or three-step quinone formation).
  parents:
  - xmet:7900000
  related_match:
  - xmet:0000300
  - xmet:0000308
  - xmet:0000309
- id: xmet:7900003
  preferred_label: preparatory intermediate step
  definition: Intermediate that enables a subsequent defining step (e.g. hydroxylation before quinone
    formation).
  parents:
  - xmet:7900000
  related_match:
  - xmet:0000308
  - xmet:0000309
- id: xmet:7900004
  preferred_label: terminal observable step
  definition: Last enumerated step yielding the reported metabolite.
  parents:
  - xmet:7900000
- id: xmet:7900005
  preferred_label: pathway-step role unspecified
  definition: Step role in a path is not asserted.
  parents:
  - xmet:7900000
- id: xmet:8000000
  preferred_label: aromatic and conjugated-system impact
  synonyms:
  - aromatic/conjugate impact
  - π-system impact
  definition: 'Parallel hierarchy focused on how a transformation impacts aromatic and conjugated π-systems:
    loss or gain of aromaticity, engagement of conjugated acceptors, and rearrangements within those systems.
    Orthogonal to both the chemist reaction-type spine and the Metabolic Forest map.'
  parents:
  - xmet:1700000
- id: xmet:8000001
  preferred_label: aromaticity loss
  definition: Transformations that destroy or interrupt an aromatic system.
  parents:
  - xmet:8000000
  related_match:
  - xmet:0004001
- id: xmet:8000002
  preferred_label: aromaticity gain
  definition: Transformations that form or restore an aromatic system.
  parents:
  - xmet:8000000
  related_match:
  - xmet:0004002
  - xmet:0000315
- id: xmet:8000003
  preferred_label: aromatic ring substitution impact
  definition: Substitution on an aromatic ring that preserves the aromatic sextet (e.g. phenolic hydroxylation
    after NIH shift).
  parents:
  - xmet:8000000
  related_match:
  - xmet:0000101
  - xmet:0004003
  - xmet:0004004
- id: xmet:8000004
  preferred_label: conjugated π-system engagement
  definition: Reactions whose defining impact is engagement of a conjugated acceptor or donor (Michael
    acceptors, quinoids, extended enones).
  parents:
  - xmet:8000000
  related_match:
  - xmet:0004014
  - xmet:0000300
  - xmet:0001031
- id: xmet:8000005
  preferred_label: quinoid π-system formation
  definition: Formation of quinone, quinone-imine, quinone-methide, or imine-methide π-systems from aromatic
    or conjugated precursors.
  parents:
  - xmet:8000000
  related_match:
  - xmet:0000300
  - xmet:0000303
  - xmet:0000304
  - xmet:0000306
- id: xmet:8000006
  preferred_label: heteroaromatic oxidation impact
  definition: Oxidation paths that specifically perturb heteroaromatic rings (e.g. thiophene S-oxidation
    or epoxidation).
  parents:
  - xmet:8000000
  related_match:
  - xmet:0000133
  - xmet:0000113
- id: xmet:8000007
  preferred_label: arene oxide pathway
  definition: Passage through an arene oxide / NIH-shift manifold on an aromatic ring.
  parents:
  - xmet:8000000
  related_match:
  - xmet:0000112
  - xmet:0004003
  - xmet:0004005
- id: xmet:8000008
  preferred_label: conjugated adduct formation
  definition: Conjugation (e.g. GSH) that captures a conjugated electrophile without requiring the reaction
    type hierarchy.
  parents:
  - xmet:8000000
  related_match:
  - xmet:0001031
  - xmet:0001036
  - xmet:0004014
- id: xmet:9000000
  preferred_label: Metabolic Forest map
  synonyms: *id014
  definition: Alias / mapping spine for Metabolic Forest rulesets → rules → patterns. Opaque forest.*
    CURIEs only; not the chemist backbone.
  parents:
  - xmet:0000000
- id: xmet:9000010
  preferred_label: stable oxygenation ruleset
  synonyms:
  - Forest stable oxygenation
  - SO ruleset
  definition: Metabolic Forest ruleset alias for stable oxygenation (opaque forest.ruleset:SO). Not the
    chemist Rainbow class.
  parents:
  - xmet:9000000
  - xmet:9000018
  exact_match:
  - forest.ruleset:SO
- id: xmet:9000011
  preferred_label: unstable oxygenation ruleset
  synonyms:
  - Forest unstable oxygenation
  - UO ruleset
  definition: Metabolic Forest ruleset alias for unstable oxygenation (opaque forest.ruleset:UO). Not
    the chemist Rainbow class.
  parents:
  - xmet:9000000
  - xmet:9000018
  exact_match:
  - forest.ruleset:UO
- id: xmet:9000012
  preferred_label: dehydrogenation ruleset
  definition: Forest ruleset containing the Dehydrogenation rule (quinone formation is a separate Forest
    ruleset). Full name only; localized abbreviations are not XMET labels.
  parents:
  - xmet:9000000
  - xmet:9000018
- id: xmet:9000013
  preferred_label: hydrolysis ruleset
  definition: Forest ruleset for Hydrolysis, EpoxideOpening, Dephosphorylation (and AzoSplitting in Full).
    Full name only; localized abbreviations are not XMET labels.
  parents:
  - xmet:9000000
  - xmet:9000018
- id: xmet:9000014
  preferred_label: reduction ruleset
  definition: Forest ruleset for hydrogenation, dehydration, nitrogen/oxygen/sulfur reduction, reductive
    dehalogenation. Full name only; localized abbreviations are not XMET labels.
  parents:
  - xmet:9000000
  - xmet:9000018
- id: xmet:9000015
  preferred_label: quinone formation ruleset
  definition: Forest ruleset for quinone / quinone-imine / quinone-methide structure enumeration. Full
    name only; localized abbreviations are not XMET labels.
  parents:
  - xmet:9000000
- id: xmet:9000016
  preferred_label: conjugation ruleset
  definition: 'Forest conjugation ruleset: acetylation, glucuronidation, glutathionation, sulfation. Full
    name only; localized abbreviations are not XMET labels.'
  parents:
  - xmet:9000000
- id: xmet:9000017
  preferred_label: tautomerization ruleset
  definition: Forest tautomerization ruleset. Full name only; localized abbreviations are not XMET labels.
  parents:
  - xmet:9000000
- id: xmet:9000018
  preferred_label: phase I ruleset
  definition: Forest Phase I aggregate ruleset (stable/unstable oxygenation, dehydrogenation, hydrolysis,
    reduction). Full name only; localized abbreviations are not XMET labels.
  parents:
  - xmet:9000000
- id: xmet:9000019
  preferred_label: bioactivation ruleset
  definition: Forest convenience ruleset for common bioactivation routes (quinone, epoxidation, nitroaromatic
    reduction, thiophene S-oxidation). Full name only; localized abbreviations are not XMET labels.
  parents:
  - xmet:9000000
- id: xmet:9100100
  preferred_label: Hydroxylation rule
  synonyms:
  - Hydroxylation
  definition: Metabolic Forest rule `Hydroxylation` in the Forest-map hierarchy.
  parents:
  - xmet:9000010
  related_match:
  - xmet:0000100
- id: xmet:9100110
  preferred_label: Epoxidation rule
  synonyms:
  - Epoxidation
  definition: Metabolic Forest rule `Epoxidation` in the Forest-map hierarchy.
  parents:
  - xmet:9000010
  related_match:
  - xmet:0000110
- id: xmet:9100120
  preferred_label: NitrogenOxidation rule
  synonyms:
  - NitrogenOxidation
  definition: Metabolic Forest rule `NitrogenOxidation` in the Forest-map hierarchy.
  parents:
