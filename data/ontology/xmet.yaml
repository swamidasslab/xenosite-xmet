scheme:
  id: xmet:scheme
  preferred_label: Xenobiotic Reaction Metabolism
  iri: https://xenosite.org/ontology/xmet#
  definition: Metabolism-specific med-chem SKOS thesaurus for xenobiotic reaction naming — not a 
    full chemical ontology. Site-localized display names use templates outside the concept scheme. 
    SSSOM maps to RXNO/MOP/GO/ChEBI/Rhea/KEGG/MeSH/ECO/CHMO.
concepts:
- id: xmet:4000000
  preferred_label: xenobiotic biotransformation
  synonyms:
  - xenobiotic metabolism
  - biotransformation
  - drug metabolism
  definition: Chemical alteration of an exogenous substance in a biological system.
- id: xmet:4000001
  preferred_label: phase I
  synonyms:
  - phase 1
  - functionalization
  - Metabolic Detoxication, Phase I
  - phase 1 metabolism
  - functionalization phase
  definition: 'Functionalization stage tag: oxidation, reduction, hydrolysis, and related edits that introduce
    or expose polar groups. Not a chemical superclass.'
  parents:
  - xmet:4000212
- id: xmet:4000002
  preferred_label: phase II
  synonyms:
  - phase 2
  - conjugation
  - Metabolic Detoxication, Phase II
  - phase 2 metabolism
  - conjugation phase
  definition: 'Conjugation stage tag: binding to endogenous moieties. Not a chemical superclass — transfer
    conjugations and adducts are distinguished under reaction class.'
  parents:
  - xmet:4000212
- id: xmet:4000003
  preferred_label: phase III
  synonyms:
  - phase 3
  - phase III
  - transport phase
  definition: Further handling / transport / excretion-related disposition of conjugates and 
    metabolites. Disposition tag, not a reaction class.
  parents:
  - xmet:4000212
- id: xmet:4000004
  preferred_label: stable oxygenation
  synonyms:
  - SO class
  - stable oxygen addition class
  - Rainbow stable oxygenation
  - SO class (full name)
  - stable_oxygenation
  definition: 'Oxygenation that yields a stable oxygenated metabolite (aromatic/aliphatic hydroxylation,
    epoxidation, N-oxidation, S-oxidation).'
  parents:
  - xmet:4000009
- id: xmet:4000005
  preferred_label: unstable oxygenation
  synonyms:
  - UO class
  - unstable oxygen addition class
  - Rainbow unstable oxygenation
  - UO class (full name)
  - unstable_oxygenation
  definition: 'Oxygenation that triggers cleavage or rearrangement (N-/O-/S-/C-dealkylation, oxidative
    deamination, oxidative dehalogenation).'
  parents:
  - xmet:4000009
- id: xmet:4000006
  preferred_label: dehydrogenation
  synonyms:
  - desaturation
  definition: 'Extract hydrogen(s) to form a multiple bond, iminium, or quinoid. Nested under oxidation.
    Often an elementary part of conjugated-system remodeling (including quinone-like paths).'
  parents:
  - xmet:4000009
  is_part_of:
  - xmet:4000406
  related_to:
  - xmet:4000059
- id: xmet:4000007
  preferred_label: hydrolysis
  definition: 'Water addition cleaves amide, ester, ether, or related bonds. Nested under isoredox (redox-neutral).'
  parents:
  - xmet:4000265
  related_to:
  - xmet:4000077
- id: xmet:4000008
  preferred_label: reduction
  definition: 'Remove oxygen or add hydrogen(s) (nitro, carbonyl, sulfo reduction; reductive dehalogenation;
    hydrogenation). Peer of oxidation and isoredox under reaction class.'
  parents:
  - xmet:4000213
  related_to:
  - xmet:4000113
- id: xmet:4000009
  preferred_label: oxidation
  synonyms:
  - oxidative metabolism
  definition: Oxidations and related increase of oxidation state. Holds stable oxygenation, unstable
    oxygenation, and dehydrogenation.
  parents:
  - xmet:4000213
- id: xmet:4000010
  preferred_label: heteroatom oxidation
  definition: Direct oxidation of N, S (and related heteroatoms).
  parents:
  - xmet:4000004
- id: xmet:4000011
  preferred_label: conjugation
  definition: Addition of an endogenous or trapping moiety. Split into transfer conjugation 
    (clearance-oriented) and adduct formation (electrophile capture).
  parents:
  - xmet:4000213
  close_match:
  - xmet:4000002
  antonyms:
  - xmet:4000147
- id: xmet:4000012
  preferred_label: hydroxylation
  synonyms:
  - C-hydroxylation
  - monooxygenation hydroxylation
  - hydroxylation to alcohol
  - hydroxylation to alcohol or oxide
  definition: Introduction of a hydroxyl group, typically at carbon.
  parents:
  - xmet:4000004
  antonyms:
  - xmet:4000128
  related_to:
  - xmet:4000203
- id: xmet:4000013
  preferred_label: aromatic hydroxylation
  synonyms:
  - aryl hydroxylation
  - benzene hydroxylation
  - arene hydroxylation
  - aromatic hydroxylation to phenol
  - aromatic hydroxylation to phenol or phenolate
  definition: Hydroxylation of an aromatic ring; often via arene oxide / NIH-shift pathways. Often 
    an elementary part of conjugated-system remodeling toward quinone-like species.
  parents:
  - xmet:4000012
  is_part_of:
  - xmet:4000406
  related_to:
  - xmet:4000059
- id: xmet:4000014
  preferred_label: aliphatic hydroxylation
  synonyms:
  - alkyl hydroxylation
  definition: Hydroxylation of an aliphatic carbon (not limited to methyl/methylene; see also 
    tertiary carbon hydroxylation under methine hydroxylation).
  parents:
  - xmet:4000380
- id: xmet:4000015
  preferred_label: para-hydroxylation
  definition: Para-regioselective aromatic hydroxylation.
  parents:
  - xmet:4000013
- id: xmet:4000016
  preferred_label: ortho-hydroxylation
  definition: Ortho-regioselective aromatic hydroxylation.
  parents:
  - xmet:4000013
- id: xmet:4000017
  preferred_label: meta-hydroxylation
  definition: Meta-regioselective aromatic hydroxylation.
  parents:
  - xmet:4000013
- id: xmet:4000018
  preferred_label: benzylic hydroxylation
  synonyms:
  - toluene side-chain hydroxylation
  definition: Hydroxylation at a carbon adjacent to an aromatic ring (benzylic). May be methyl, 
    methylene, or methine; under hydroxylation of activated carbons.
  parents:
  - xmet:4000379
- id: xmet:4000019
  preferred_label: allylic hydroxylation
  definition: Hydroxylation at a carbon adjacent to a C=C bond (allylic). Under hydroxylation of 
    activated carbons; not restricted to methine sites.
  parents:
  - xmet:4000379
- id: xmet:4000020
  preferred_label: ω-hydroxylation
  synonyms:
  - omega-hydroxylation
  - terminal methyl hydroxylation
  definition: 'ω-hydroxylation: xenobiotic-metabolism term under aliphatic hydroxylation.'
  parents:
  - xmet:4000378
- id: xmet:4000021
  preferred_label: ω-1 hydroxylation
  synonyms:
  - omega-1 hydroxylation
  - penultimate carbon hydroxylation
  definition: 'ω-1 hydroxylation: xenobiotic-metabolism term under aliphatic hydroxylation.'
  parents:
  - xmet:4000378
- id: xmet:4000022
  preferred_label: epoxidation
  synonyms:
  - oxirane formation
  definition: Formation of a three-membered epoxide ring.
  parents:
  - xmet:4000004
- id: xmet:4000023
  preferred_label: alkene epoxidation
  definition: 'alkene epoxidation: xenobiotic-metabolism term under epoxidation.'
  parents:
  - xmet:4000022
- id: xmet:4000024
  preferred_label: arene oxide formation
  synonyms:
  - arene oxide
  definition: Epoxidation of an aromatic π-system to an arene oxide intermediate.
  parents:
  - xmet:4000290
  is_part_of:
  - xmet:4000323
  - xmet:4000324
  related_to:
  - xmet:4000197
- id: xmet:4000025
  preferred_label: thiophene epoxidation
  synonyms:
  - thiohene epoxidation
  definition: 'thiophene epoxidation: xenobiotic-metabolism term under epoxidation, heteroaromatic oxidation
    impact.'
  parents:
  - xmet:4000022
- id: xmet:4000026
  preferred_label: nitrogen oxidation
  synonyms:
  - N-oxidation
  definition: 'nitrogen oxidation: xenobiotic-metabolism term under heteroatom oxidation, stable oxygenation.'
  parents:
  - xmet:4000010
- id: xmet:4000027
  preferred_label: N-oxide formation
  synonyms:
  - tertiary amine N-oxidation
  definition: Formation of an N-oxide from a tertiary amine (or equivalent trivalent nitrogen with 
    no N–H).
  parents:
  - xmet:4000026
- id: xmet:4000028
  preferred_label: hydroxylamine formation
  synonyms:
  - N-hydroxylation
  definition: Formation of a hydroxylamine by N-oxidation of a primary or secondary amine (N–H → 
    N–OH).
  parents:
  - xmet:4000026
- id: xmet:4000029
  preferred_label: nitroso formation
  definition: Formation of a nitroso group by N-oxidation of a primary amine (–NH2 → –N=O).
  parents:
  - xmet:4000026
- id: xmet:4000030
  preferred_label: primary amine N-oxidation
  definition: N-oxidation of a primary amine, typically yielding a hydroxylamine (or further 
    nitroso).
  parents:
  - xmet:4000028
- id: xmet:4000031
  preferred_label: aromatic amine N-oxidation
  definition: N-oxidation of an aromatic amine, typically yielding an aryl hydroxylamine.
  parents:
  - xmet:4000028
- id: xmet:4000032
  preferred_label: sulfur oxidation
  synonyms:
  - S-oxidation
  definition: 'sulfur oxidation: xenobiotic-metabolism term under heteroatom oxidation, stable oxygenation.'
  parents:
  - xmet:4000010
- id: xmet:4000033
  preferred_label: sulfoxidation
  synonyms:
  - sulfoxide formation
  definition: 'sulfoxidation: xenobiotic-metabolism term under sulfur oxidation.'
  parents:
  - xmet:4000299
- id: xmet:4000034
  preferred_label: sulfone formation
  definition: 'sulfone formation: xenobiotic-metabolism term under sulfur oxidation.'
  parents:
  - xmet:4000299
- id: xmet:4000035
  preferred_label: thiophene S-oxidation
  synonyms:
  - Thiohene S-oxidation
  - thiohene S-oxidation
  definition: S-oxidation of a thiophene ring; a dearomatizing path to S-oxides.
  parents:
  - xmet:4000032
- id: xmet:4000036
  preferred_label: thiol oxidation
  definition: 'thiol oxidation: xenobiotic-metabolism term under sulfur oxidation.'
  parents:
  - xmet:4000298
- id: xmet:4000037
  preferred_label: disulfide formation
  definition: Formation of a disulfide (R–S–S–R′) by sulfur oxidation / oxidative coupling. Does not
    require an S=O (sulfur oxo) bond.
  parents:
  - xmet:4000032
- id: xmet:4000038
  preferred_label: primary carbon hydroxylation
  definition: 'primary carbon hydroxylation: xenobiotic-metabolism term under aliphatic hydroxylation.'
  parents:
  - xmet:4000378
- id: xmet:4000039
  preferred_label: secondary carbon hydroxylation
  definition: 'secondary carbon hydroxylation: xenobiotic-metabolism term under aliphatic hydroxylation.'
  parents:
  - xmet:4000378
- id: xmet:4000040
  preferred_label: tertiary carbon hydroxylation
  definition: 'tertiary carbon hydroxylation: xenobiotic-metabolism term under aliphatic hydroxylation.'
  parents:
  - xmet:4000291
- id: xmet:4000041
  preferred_label: alicyclic hydroxylation
  definition: Hydroxylation of a saturated ring carbon.
  parents:
  - xmet:4000380
- id: xmet:4000042
  preferred_label: dealkylation
  synonyms:
  - oxidative dealkylation
  - carbon–heteroatom oxidative cleavage
  definition: Oxidative removal of an alkyl group from N, O, S, or C via α-carbon hydroxylation.
  parents:
  - xmet:4000005
  antonyms:
  - xmet:4000116
- id: xmet:4000043
  preferred_label: N-dealkylation
  synonyms:
  - oxidative N-dealkylation
  - N-dealkylative cleavage
  definition: 'N-dealkylation: xenobiotic-metabolism term under dealkylation.'
  parents:
  - xmet:4000042
- id: xmet:4000044
  preferred_label: O-dealkylation
  synonyms:
  - oxidative O-dealkylation
  definition: 'O-dealkylation: xenobiotic-metabolism term under dealkylation.'
  parents:
  - xmet:4000042
- id: xmet:4000045
  preferred_label: S-dealkylation
  definition: 'S-dealkylation: xenobiotic-metabolism term under dealkylation.'
  parents:
  - xmet:4000042
- id: xmet:4000046
  preferred_label: C-dealkylation
  synonyms:
  - oxidative C–C cleavage
  - oxidative carbon–carbon cleavage
  - carbon–carbon dealkylation
  definition: Oxidative cleavage of a carbon–carbon bond with loss of an alkyl fragment (xenobiotic 
    C-dealkylation). Chemically oxidative C–C cleavage, not N-/O-/S-dealkylation. Alcohol- and 
    carbonyl-level cleavage patterns share this home; ox-state via alwaysWith. Quaternary site child
    for quaternary C–C alcohol-level cleavage.
  parents:
  - xmet:4000042
- id: xmet:4000047
  preferred_label: N-deethylation
  definition: 'N-deethylation: xenobiotic-metabolism term under N-dealkylation.'
  parents:
  - xmet:4000350
- id: xmet:4000048
  preferred_label: N-depropylation
  definition: 'N-depropylation: xenobiotic-metabolism term under N-dealkylation.'
  parents:
  - xmet:4000350
- id: xmet:4000049
  preferred_label: oxidative deamination
  synonyms:
  - deamination
  definition: α-Carbon hydroxylation of a primary (or suitable) amine releasing ammonia/amine and a 
    carbonyl.
  parents:
  - xmet:4000318
- id: xmet:4000050
  preferred_label: O-demethylation
  synonyms:
  - aryl methyl ether cleavage
  - oxidative O-demethylation
  definition: 'O-demethylation: xenobiotic-metabolism term under O-dealkylation.'
  parents:
  - xmet:4000344
- id: xmet:4000051
  preferred_label: oxidative dehalogenation
  synonyms:
  - oxidative dehalogenation
  definition: Replacement of halogen by oxygen via oxidative pathways. Under unstable oxygenation; 
    related to isoredox dehalogenation (not a subtype of it).
  parents:
  - xmet:4000005
  related_to:
  - xmet:4000214
  always_with:
  - xmet:4000236
- id: xmet:4000052
  preferred_label: O-deethylation
  definition: 'O-deethylation: xenobiotic-metabolism term under O-dealkylation.'
  parents:
  - xmet:4000345
- id: xmet:4000053
  preferred_label: aromatic O-dealkylation
  definition: Cleavage of an aryl–O–alkyl ether (e.g. anisole → phenol).
  parents:
  - xmet:4000044
- id: xmet:4000054
  preferred_label: aliphatic O-dealkylation
  definition: 'aliphatic O-dealkylation: xenobiotic-metabolism term under O-dealkylation.'
  parents:
  - xmet:4000044
- id: xmet:4000055
  preferred_label: oxidative defluorination
  definition: 'oxidative defluorination: xenobiotic-metabolism term under oxidative dehalogenation.'
  parents:
  - xmet:4000307
  always_with:
  - xmet:4000237
- id: xmet:4000056
  preferred_label: oxidative dechlorination
  definition: 'oxidative dechlorination: xenobiotic-metabolism term under oxidative dehalogenation.'
  parents:
  - xmet:4000307
  always_with:
  - xmet:4000238
- id: xmet:4000057
  preferred_label: oxidative debromination
  definition: 'oxidative debromination: xenobiotic-metabolism term under oxidative dehalogenation.'
  parents:
  - xmet:4000307
  always_with:
  - xmet:4000239
- id: xmet:4000410
  preferred_label: oxidative deiodination
  definition: 'oxidative deiodination: xenobiotic-metabolism term under oxidative dehalogenation.'
  parents:
  - xmet:4000307
  always_with:
  - xmet:4000240
- id: xmet:4000058
  preferred_label: S-demethylation
  synonyms:
  - oxidative S-demethylation
  definition: Oxidative removal of an S-methyl group.
  parents:
  - xmet:4000344
- id: xmet:4000406
  preferred_label: conjugated-system remodeling
  synonyms:
  - conjugated π-system remodeling
  - conjugated-system transformation
  - Forest QuinoneFormation
  definition: Coordinated multi-site remodeling that builds or extends a conjugated π-system. 
    Broader than aromatic quinoid collapse; pattern coverage currently emphasizes aromatic→quinoid 
    endpoints. Children distinguish quinone-like species formation, quinone-like endpoint 
    transformations, and nonaromatic conjugated-system remodeling.
  parents:
  - xmet:4000213
- id: xmet:4000059
  preferred_label: quinone-like species formation
  synonyms:
  - quinoid formation
  - quinoid species formation
  - quinone-like formation
  - quinonation
  definition: 'Aromatic→quinoid remodeling under conjugated-system remodeling: two distinct sites on an
    aromatic system are oxidized/dehydrogenated so the ring collapses into a non-aromatic conjugated quinoid
    (classical quinones, quinone-imines, quinone-methides, imine-methides). Not necessarily a composite
    pathway — an already hydroxylated precursor may need only terminating dehydrogenation. Specific multi-step
    routes may be modeled under composite transformation.'
  parents:
  - xmet:4000406
  related_to:
  - xmet:4000272
  - xmet:4000013
  - xmet:4000006
- id: xmet:4000407
  preferred_label: nonaromatic conjugated-system remodeling
  synonyms:
  - nonaromatic conjugated-system transformation
  - non-aromatic conjugated π-system remodeling
  definition: Conjugated-system remodeling outside aromatic→quinoid collapse. Placement shelf for 
    conjugated π-system edits that current aromatic quinoid patterns do not yet cover.
  parents:
  - xmet:4000406
- id: xmet:4000060
  preferred_label: ortho-quinone formation
  definition: 'Formation of an ortho-quinone (1,2-diketone): two adjacent ring sites are oxidized/dehydrogenated,
    collapsing aromaticity into a conjugated non-aromatic ortho-quinoid. Narrow classical quinone, not
    quinone-imine/methide.'
  parents:
  - xmet:4000394
  synonyms:
  - o-quinone formation
  - 1,2-quinone formation
  - ortho-quinoid formation
- id: xmet:4000061
  preferred_label: para-quinone formation
  definition: 'Formation of a para-quinone (1,4-diketone): two para-related ring sites are oxidized/dehydrogenated,
    collapsing aromaticity into a conjugated non-aromatic para-quinoid. Narrow classical quinone, not
    quinone-imine/methide.'
  parents:
  - xmet:4000394
  synonyms:
  - p-quinone formation
  - 1,4-quinone formation
  - para-quinoid formation
- id: xmet:4000062
  preferred_label: quinone-imine formation
  synonyms:
  - quinone imine formation
  - NAPQI-type formation
  - quinoid imine formation
  definition: 'Formation of a quinone-imine: one or both quinoid ends are C=N rather than C=O. Two distinct
    sites are dehydrogenated so an aromatic system collapses into a non-aromatic conjugated quinoid (e.g.
    NAPQI-type). Sibling of classical quinone formation under quinone-like species formation.'
  parents:
  - xmet:4000059
- id: xmet:4000063
  preferred_label: quinone-methide formation
  synonyms:
  - quinone methide formation
  - quinoid methide formation
  - imine-methide formation
  definition: 'Formation of a quinone-methide: a quinoid with an exocyclic alkylidene/methide end (including
    imine-methide variants). Two distinct sites are dehydrogenated so an aromatic system collapses into
    a non-aromatic conjugated quinoid. Sibling of classical quinone formation under quinone-like species
    formation.'
  parents:
  - xmet:4000059
- id: xmet:4000064
  preferred_label: iminium ion formation
  synonyms:
  - iminium formation
  definition: Formation of an iminium ion, typically by amine dehydrogenation.
  parents:
  - xmet:4000216
- id: xmet:4000065
  preferred_label: imine-methide formation
  synonyms:
  - imine methide formation
  definition: Formation of an imine-methide (or related methide) from an amine dehydrogenation path.
  parents:
  - xmet:4000216
- id: xmet:4000066
  preferred_label: one-step
  synonyms:
  - 1-step
  - single-step
  - one-step transformation
  - one-step quinone-like species formation
  - 1-step quinone-like species formation
  - direct quinone-like species formation
  - one-step quinone formation
  definition: 'Descriptor: transformation counted as a single formal metabolic step. For quinone-like
    species formation, the elementary-plan dependency cone into terminating dehydrogenation has size 1
    (DH alone — both quinoid ends already present). Free co-occurring plan steps that do not precede DH
    do not deepen this count.'
  parents:
  - xmet:4000393
- id: xmet:4000067
  preferred_label: two-step
  synonyms:
  - 2-step
  - two-step transformation
  - two-step quinone-like species formation
  - 2-step quinone-like species formation
  - two-step quinone formation
  definition: 'Descriptor: transformation counted as two formal metabolic steps. For quinone-like species
    formation, the dependency cone into terminating dehydrogenation has size 2 — one preparatory elementary
    step that precedes DH, then DH (prep typically hydroxylation or oxidative dehalogenation).'
  parents:
  - xmet:4000393
- id: xmet:4000068
  preferred_label: three-step
  synonyms:
  - 3-step
  - three-or-more-step
  - three-step transformation
  - three-step quinone-like species formation
  - 3-step quinone-like species formation
  - three-step quinone formation
  definition: 'Descriptor: transformation counted as three or more formal metabolic steps. For quinone-like
    species formation, the dependency cone into terminating dehydrogenation has size ≥3 — two (or more)
    preparatory elementary steps that precede DH, then DH.'
  parents:
  - xmet:4000393
- id: xmet:4000069
  preferred_label: alcohol oxidation
  synonyms:
  - alcohol dehydrogenation
  - alcohol to aldehyde
  definition: Dehydrogenation of an alcohol to a carbonyl (primary alcohol → aldehyde; secondary → 
    ketone).
  parents:
  - xmet:4000006
- id: xmet:4000070
  preferred_label: primary alcohol oxidation
  definition: Dehydrogenation of a primary alcohol to an aldehyde.
  parents:
  - xmet:4000069
- id: xmet:4000071
  preferred_label: secondary alcohol oxidation
  definition: Dehydrogenation of a secondary alcohol to a ketone.
  parents:
  - xmet:4000069
- id: xmet:4000072
  preferred_label: aldehyde oxidation
  synonyms:
  - aldehyde to carboxylic acid
  definition: Dehydrogenation / oxidation of an aldehyde toward carboxylic acid. Sibling of alcohol 
    oxidation under dehydrogenation, not a subtype of it.
  parents:
  - xmet:4000006
- id: xmet:4000073
  preferred_label: alkene formation
  synonyms:
  - desaturation to alkene
  definition: 'alkene formation: xenobiotic-metabolism term under dehydrogenation.'
  parents:
  - xmet:4000302
- id: xmet:4000074
  preferred_label: aromatization
  definition: Formation or restoration of an aromatic system.
  parents:
  - xmet:4000274
  antonyms:
  - xmet:4000194
- id: xmet:4000075
  preferred_label: single- to double-bond dehydrogenation
  synonyms:
  - bond unsaturation to alkene
  definition: Dehydrogenation that converts a single bond into a double bond.
  parents:
  - xmet:4000302
- id: xmet:4000076
  preferred_label: double- to triple-bond dehydrogenation
  synonyms:
  - bond unsaturation to alkyne
  definition: Dehydrogenation converting a double bond into a triple bond. Under carbon–carbon 
    dehydrogenation (not under alkane dehydrogenation).
  parents:
  - xmet:4000395
- id: xmet:4000077
  preferred_label: epoxide opening
  synonyms:
  - epoxide hydrolysis
  definition: Opening of an epoxide ring (hydration to diol, or rearrangement). Under isoredox; not 
    a subtype of hydrolysis. Hydration vs rearrangement specialize underneath.
  parents:
  - xmet:4000265
  related_to:
  - xmet:4000007
- id: xmet:4000078
  preferred_label: ester hydrolysis
  synonyms:
  - de-esterification
  - C-de-esterification
  - deesterification
  definition: 'ester hydrolysis: xenobiotic-metabolism term under hydrolysis.'
  parents:
  - xmet:4000352
- id: xmet:4000079
  preferred_label: amide hydrolysis
  definition: 'amide hydrolysis: xenobiotic-metabolism term under hydrolysis.'
  parents:
  - xmet:4000353
- id: xmet:4000080
  preferred_label: lactone hydrolysis
  definition: 'lactone hydrolysis: xenobiotic-metabolism term under ester hydrolysis.'
  parents:
  - xmet:4000352
- id: xmet:4000081
  preferred_label: lactam hydrolysis
  definition: 'lactam hydrolysis: xenobiotic-metabolism term under amide hydrolysis.'
  parents:
  - xmet:4000353
- id: xmet:4000082
  preferred_label: carbamate hydrolysis
  definition: 'carbamate hydrolysis: xenobiotic-metabolism term under hydrolysis.'
  parents:
  - xmet:4000353
- id: xmet:4000083
  preferred_label: urea hydrolysis
  definition: 'urea hydrolysis: xenobiotic-metabolism term under hydrolysis.'
  parents:
  - xmet:4000353
- id: xmet:4000084
  preferred_label: ether cleavage
  synonyms:
  - hydrolytic ether cleavage
  definition: Hydrolytic or solvolytic cleavage of ethers (distinct from oxidative O-dealkylation).
  parents:
  - xmet:4000354
