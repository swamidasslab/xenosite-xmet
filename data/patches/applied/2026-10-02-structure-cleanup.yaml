id: 2026-10-02-structure-cleanup
author: '@swamidass'
rationale: Structural cleanup from the quality review. Primary and secondary carbon
  hydroxylation join tertiary in carbon-class homes (methyl/methylene vs methine);
  O-deethylation sits under deethylation as O-demethylation sits under demethylation;
  the GSH neutral loss is not a kind of mass shift; sulfo reduction duplicates sulfoxide
  reduction; thiol oxidation duplicates sulfenic acid formation.
